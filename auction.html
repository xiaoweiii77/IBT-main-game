<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時拍賣中心 - IBT</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #1a1a2e; color: white; padding: 20px; text-align: center; }
    .container { max-width: 600px; margin: 0 auto; background: #16213e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-top: 5px solid #e94560; }
    h1 { color: #e94560; margin-bottom: 5px; }
    .notice { color: #f1c40f; font-weight: bold; margin-bottom: 20px; font-size: 18px; }
    
    .auction-board { background: #0f3460; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    .item-name { font-size: 28px; font-weight: bold; color: #fff; }
    .timer { font-size: 50px; font-weight: bold; color: #e74c3c; margin: 10px 0; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
    .highest-bid { font-size: 24px; color: #2ecc71; }
    
    /* 身份綁定區塊樣式 */
    .identity-area { background: #2c3e50; padding: 20px; border-radius: 10px; border: 1px solid #f1c40f; margin-bottom: 20px; }
    .identity-area h3 { margin-top: 0; color: #f1c40f; }
    .logged-in-area { display: none; background: #28a745; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; font-size: 18px; cursor: pointer; }
    
    .bid-area { display: none; background: #1a1a2e; padding: 20px; border-radius: 10px; border: 1px solid #4a4e69; }
    .bid-area.active { display: block; }
    select, input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; font-size: 18px; text-align: center; }
    button { width: 100%; padding: 15px; font-size: 20px; font-weight: bold; background-color: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background-color: #218838; }
    .btn-bind { background-color: #f1c40f; color: #000; }
    .btn-bind:hover { background-color: #f39c12; }
    
    .winner-banner { display: none; background: #f1c40f; color: #000; padding: 15px; font-size: 24px; font-weight: bold; border-radius: 8px; margin-top: 20px; animation: pop 0.5s ease-in-out; }
    @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>💌 告白信封 拍賣中心</h1>
    <div class="notice" id="noticeMsg">載入中...</div>

    <!-- 1. 尚未綁定時顯示的選擇區 -->
    <div class="identity-area" id="identityArea">
      <h3>🔒 班級代表綁定</h3>
      <p style="font-size: 14px; color: #ccc; margin-bottom: 15px;">請選擇你的班級（選定後將鎖定此設備，無法隨意更改以免作弊）</p>
      <select id="bindSelect">
        <option value="Class A">Class A</option>
        <option value="Class B">Class B</option>
        <option value="Class C">Class C</option>
        <option value="Class D">Class D</option>
        <option value="Class E">Class E</option>
        <option value="Class F">Class F</option>
        <option value="Class G">Class G</option>
        <option value="Class H">Class H</option>
        <option value="Class I">Class I</option>
        <option value="Class J">Class J</option>
        <option value="Class K">Class K</option>
        <option value="Class L">Class L</option>
      </select>
      <button class="btn-bind" id="btnBind">確認綁定身分</button>
    </div>

    <!-- 2. 綁定成功後顯示的綠色橫幅 -->
    <div class="logged-in-area" id="loggedInArea">
      ✅ 你目前代表：<span id="myBoundClass"></span>
    </div>

    <div class="auction-board">
      <div class="item-name" id="displayItem">等待拍賣開始...</div>
      <div class="timer" id="countdown">00:00</div>
      <div class="highest-bid">最高出價：<span id="displayBid">0</span> <br> (<span id="displayBidder">無</span>)</div>
    </div>

    <div class="winner-banner" id="winnerBanner">🎉 得標者：<span id="winClass"></span> (出價 <span id="winBid"></span>)</div>

    <!-- 出價區塊 (移除了下拉選單) -->
    <div class="bid-area" id="bidArea">
      <input type="number" id="bidAmount" placeholder="輸入你的出價金額">
      <button id="btnBid">💰 立即出價</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getDatabase, ref, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA7W4Q_-gD6---wDUTrD8YdBtOATOZGbbM",
      authDomain: "ibtmaingame.firebaseapp.com",
      databaseURL: "https://ibtmaingame-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "ibtmaingame",
      storageBucket: "ibtmaingame.firebasestorage.app",
      messagingSenderId: "1035805706833",
      appId: "1:1035805706833:web:db8095540cdfb7b2ab8670"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auctionRef = ref(db, 'auction');
    let timerInterval;

    // --- 設備綁定邏輯 (LocalStorage) ---
    const storageKey = "ibt_auction_bound_class";
    let myClass = localStorage.getItem(storageKey);

    function updateIdentityUI() {
      if (myClass) {
        document.getElementById('identityArea').style.display = 'none';
        document.getElementById('loggedInArea').style.display = 'block';
        document.getElementById('myBoundClass').innerText = myClass;
      } else {
        document.getElementById('identityArea').style.display = 'block';
        document.getElementById('loggedInArea').style.display = 'none';
      }
    }
    updateIdentityUI();

    document.getElementById('btnBind').addEventListener('click', () => {
      const selected = document.getElementById('bindSelect').value;
      if (confirm(`⚠️ 確定要綁定為「${selected}」嗎？\n綁定後這支手機只能替該班級出價，且無法任意更改！`)) {
        localStorage.setItem(storageKey, selected);
        myClass = selected;
        updateIdentityUI();
      }
    });

    // 隱藏的解除綁定機制 (快速點擊綠色橫幅 2 下)
    document.getElementById('loggedInArea').addEventListener('dblclick', () => {
      const pass = prompt("【工作人員專用】請輸入解除綁定密碼：");
      if (pass === "1234") { // 密碼設定為 1234
        localStorage.removeItem(storageKey);
        myClass = null;
        updateIdentityUI();
        alert("綁定已解除！可以重新選擇班級。");
      }
    });
    // ------------------------------------

    onValue(auctionRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      document.getElementById('noticeMsg').innerText = data.nextAuctionMsg;
      document.getElementById('displayItem').innerText = data.itemName;
      document.getElementById('displayBid').innerText = data.highestBid;
      document.getElementById('displayBidder').innerText = data.highestBidder;

      if (data.status === "active") {
        document.getElementById('bidArea').classList.add('active');
        document.getElementById('winnerBanner').style.display = 'none';
        startTimer(data.endTime);
      } else {
        document.getElementById('bidArea').classList.remove('active');
        clearInterval(timerInterval);
        document.getElementById('countdown').innerText = "00:00";
      }
    });

    function startTimer(endTime) {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const now = Date.now();
        const timeLeft = Math.floor((endTime - now) / 1000);

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById('countdown').innerText = "00:00";
          document.getElementById('bidArea').classList.remove('active');
          
          const highestBidder = document.getElementById('displayBidder').innerText;
          const highestBid = document.getElementById('displayBid').innerText;
          
          if(highestBidder !== "無") {
            document.getElementById('winClass').innerText = highestBidder;
            document.getElementById('winBid').innerText = highestBid;
            document.getElementById('winnerBanner').style.display = 'block';
          }
        } else {
          const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
          const s = String(timeLeft % 60).padStart(2, '0');
          document.getElementById('countdown').innerText = `${m}:${s}`;
        }
      }, 100);
    }

    document.getElementById('btnBid').addEventListener('click', async () => {
      // 檢查是否已綁定
      if (!myClass) {
        return alert("請先在上方綁定你的班級代表身分！");
      }

      const myBid = parseInt(document.getElementById('bidAmount').value);
      if (!myBid || isNaN(myBid)) return alert("請輸入有效的金額！");

      try {
        const snapshot = await get(auctionRef);
        const data = snapshot.val();

        if (data.status !== "active" || Date.now() > data.endTime) {
          return alert("拍賣已經結束，無法出價！");
        }

        if (myBid <= data.highestBid) {
          return alert(`出價失敗！目前最高價已經是 ${data.highestBid} 了`);
        }

        // 送出資料時，直接使用 myClass (綁定的班級)，無法偽造
        await update(auctionRef, {
          highestBid: myBid,
          highestBidder: myClass
        });
        document.getElementById('bidAmount').value = ''; 

      } catch (error) {
        console.error("出價發生錯誤", error);
        alert("連線異常，請重試！");
      }
    });
  </script>
</body>
</html>
